name: Relay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-typecheck:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: |
          uv venv
          . .venv/bin/activate
          uv pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          . .venv/bin/activate
          ruff check backend

      - name: Run Ruff Formatter Check
        run: |
          . .venv/bin/activate
          ruff format --check backend

      - name: Run Mypy Type Checker
        run: |
          . .venv/bin/activate
          mypy backend/src

  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv
          . .venv/bin/activate
          uv pip install -r backend/requirements.txt

      - name: Run Pytest with Coverage
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_PATH: test_ci.db
          RELAY_ADMIN_KEY: test_admin_key_ci
        run: |
          . .venv/bin/activate
          pytest --cov=src/relay --cov-report=term-missing backend/tests/

  docker-build:
    name: Docker Images Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.backend
          push: false
          tags: relay-gateway:latest

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: Run Next.js Lint
        working-directory: ./dashboard
        run: npm run lint

      - name: Build Next.js Dashboard
        working-directory: ./dashboard
        run: npm run build
